<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" />
<title>桌宠设置</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #1b1b24;
    color: #e9e9f2;
    font: 12px/1.5 "Microsoft YaHei", system-ui, sans-serif;
    user-select: none;
  }
  body { display: flex; flex-direction: column; }
  #bar {
    flex: 0 0 auto;
    -webkit-app-region: drag;
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 12px;
    background: #262634;
    border-bottom: 1px solid rgba(255,255,255,0.09);
    font-weight: 600; font-size: 13px;
    position: sticky; top: 0; z-index: 5;
  }
  #bar .btns { -webkit-app-region: no-drag; display: flex; gap: 4px; }
  #bar button {
    background: none; border: none; color: #b9b9c9;
    font-size: 16px; line-height: 1; cursor: pointer; padding: 2px 6px; border-radius: 6px;
  }
  #bar button:hover { background: rgba(255,255,255,0.1); color: #fff; }
  #bar button#close:hover { background: #a33; }
  #body { flex: 1 1 auto; min-height: 0; padding: 4px 12px 16px; overflow-y: auto; overflow-x: hidden; }
  .group { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.07); }
  .group:last-child { border-bottom: none; }
  .title { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; opacity: .5; margin-bottom: 7px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 8px; }
  button.act {
    background: rgba(70,70,92,.8); border: 1px solid rgba(255,255,255,.12);
    color: #e9e9f2; border-radius: 8px; padding: 5px 10px;
    font-size: 11.5px; cursor: pointer; transition: background .12s;
  }
  button.act:hover { background: rgba(108,92,200,.85); }
  button.act.danger { background: rgba(120,52,60,.8); }
  button.act.danger:hover { background: rgba(180,60,70,.9); }
  label.chk { display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 11.5px; opacity: .93; }
  label.chk input { accent-color: #9c7cf0; cursor: pointer; }
  .note { opacity: .55; font-size: 11px; }
  .label { opacity: .7; font-size: 11.5px; }
  input[type=range] { accent-color: #9c7cf0; cursor: pointer; }
  select {
    flex: 1; min-width: 150px;
    background: rgba(70,70,92,.8); border: 1px solid rgba(255,255,255,.12);
    color: #e9e9f2; border-radius: 8px; padding: 4px 6px; font-size: 11.5px;
  }
  #models { display: flex; flex-direction: column; gap: 4px; max-height: 132px; overflow-y: auto; }
  .m-item {
    padding: 5px 9px; border-radius: 8px; cursor: pointer;
    background: rgba(70,70,92,.5); font-size: 11.5px;
    display: flex; justify-content: space-between; gap: 8px;
  }
  .m-item:hover { background: rgba(108,92,200,.6); }
  .m-item.cur { background: rgba(124,92,224,.85); font-weight: 600; }
  .m-item .bad { opacity: .6; font-size: 10.5px; }
  #mlist { display: flex; flex-direction: column; gap: 3px; }
  .mv { display: flex; gap: 8px; align-items: center; padding: 5px 9px; border-radius: 7px; cursor: pointer; font-size: 11.5px; }
  .mv:hover { background: rgba(108,92,200,.55); }
  .mv .idx { min-width: 18px; opacity: .55; text-align: center; font-variant-numeric: tabular-nums; }
  .mv .nm { flex: 1; }
  .mv .grp { opacity: .45; font-size: 10.5px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .ex {
    padding: 5px 8px; border-radius: 7px; cursor: pointer; font-size: 11.5px;
    background: rgba(70,70,92,.5); text-align: center;
  }
  .ex:hover { background: rgba(108,92,200,.7); }
  .ex.cur { background: rgba(124,92,224,.85); font-weight: 600; }
  .act-item {
    display: flex; align-items: center; gap: 8px; padding: 6px 9px;
    border-radius: 7px; cursor: pointer; font-size: 11.5px;
    background: rgba(70,70,92,.5); margin-bottom: 3px;
  }
  .act-item:hover { background: rgba(108,92,200,.7); }
  .act-item .emo { min-width: 62px; opacity: .6; font-size: 10.5px; }
  .act-item .nm { flex: 1; }
</style>
</head>
<body>
  <div id="bar">
    <span>⚙ 桌宠设置</span>
    <div class="btns"><button id="close" title="关闭">×</button></div>
  </div>
  <div id="body">
    <div class="group">
      <div class="title">形象</div>
      <div id="models"></div>
      <div class="row" style="margin-top:6px">
        <button class="act" id="rescan">刷新列表</button>
        <button class="act" id="open-models">打开 models</button>
      </div>
    </div>

    <div class="group">
      <div class="title">模型动作（点一下播放）</div>
      <div id="mlist"></div>
    </div>

    <div class="group">
      <div class="title">面部表情（可叠加多选）</div>
      <div id="flist" class="cols"></div>
      <div class="note" style="margin-top:5px">不同表情用不同参数，可以同时开；圈圈眼/屑屑眼/＞＜ 共用参数会自动互斥</div>
    </div>

    <div class="group">
      <div class="title">外貌（开关式，会一直保持）</div>
      <div id="llist" class="cols"></div>
      <div class="title" style="margin-top:9px">体型</div>
      <div id="blist" class="cols"></div>
      <div class="row" style="margin-top:7px">
        <button class="act" id="ov-reset">清除全部</button>
      </div>
    </div>

    <div class="group">
      <div class="title">情绪回应动作（回答时的身体动作）</div>
      <div id="alist"></div>
      <div class="note" style="margin-top:5px">这些是收到消息自动触发的程序化动作，点一下可预览</div>
    </div>

    <div class="group">
      <div class="title">窗口</div>
      <div class="row">
        <button class="act" id="bigger">放大</button>
        <button class="act" id="smaller">缩小</button>
        <button class="act" id="size-reset">恢复默认</button>
      </div>
      <div class="row">
        <label class="chk"><input type="checkbox" id="top" /> 始终置顶</label>
        <button class="act" id="collapse">收起到托盘</button>
      </div>
    </div>

    <div class="group">
      <div class="title">互动</div>
      <div class="row">
        <button class="act" id="say">💬 说点什么</button>
        <label class="chk"><input type="checkbox" id="chat-pinned" /> 输入框常显</label>
      </div>
      <div class="row">
        <span class="label">动作幅度</span>
        <input type="range" id="amp" min="0.5" max="3.5" step="0.1" style="flex:1" />
        <span id="amp-val" class="note" style="min-width:34px;text-align:right">2.5</span>
      </div>
      <div class="row">
        <span class="label">戳一下的反应</span>
        <select id="interaction">
          <option value="local">只在本机显示气泡</option>
          <option value="astrbot">发给 AstrBot（进记忆）</option>
          <option value="off">不反应</option>
        </select>
      </div>
    </div>

    <div class="group">
      <div class="title">行为</div>
      <div class="cols">
        <label class="chk"><input type="checkbox" id="b-emotion" /> 情绪身体动作</label>
        <label class="chk"><input type="checkbox" id="b-nod" /> 说话点头节奏</label>
        <label class="chk"><input type="checkbox" id="b-multi" /> 长回复多动作</label>
        <label class="chk"><input type="checkbox" id="b-night" /> 夜间犯困</label>
        <label class="chk"><input type="checkbox" id="b-yawn" /> 打哈欠</label>
        <label class="chk"><input type="checkbox" id="b-look" /> 东张西望</label>
        <label class="chk"><input type="checkbox" id="b-turn" /> 说话前转头</label>
        <label class="chk"><input type="checkbox" id="b-greet" /> 启动问候</label>
        <label class="chk"><input type="checkbox" id="b-mouth" /> 待机嘴部动画</label>
      </div>
    </div>

    <div class="group">
      <div class="title">待机嘴型（可自己选）</div>
      <div id="mlist-idle" class="grid2"></div>
      <div class="row" style="margin-top:7px">
        <span class="label">强度</span>
        <input type="range" id="mouth-str" min="0.2" max="1" step="0.05" style="flex:1" />
        <span id="mouth-str-val" class="note" style="min-width:30px;text-align:right">0.70</span>
      </div>
    </div>

    <div class="group">
      <div class="title">连接与文件</div>
      <div class="row">
        <span id="ws" class="note">AstrBot：未知</span>
        <button class="act" id="reconnect">重连 AstrBot</button>
      </div>
      <div class="row">
        <button class="act" id="open-config">打开 config.json</button>
        <button class="act danger" id="quit">退出桌宠</button>
      </div>
    </div>
  </div>
  <script src="settings.js"></script>
</body>
</html>
